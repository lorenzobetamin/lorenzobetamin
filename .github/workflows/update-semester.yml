name: Atualizar semestre

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-semester:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Atualizar semestre no README
        run: python .github/scripts/update_semester.py

      - name: Fazer commit somente quando houver alteração
        run: |
          if git diff --quiet -- README.md; then
            echo "O semestre já está atualizado; nenhum commit necessário."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualiza semestre automaticamente"
          git push
